# Weekly updates of the actions used by the workflows and by action.yml itself
# (anchore/sbom-action). Titles follow Conventional Commits.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: ci
      include: scope
    groups:
      actions:
        patterns: ["*"]
